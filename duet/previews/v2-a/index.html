const s0 = toD(SV[0]);
// ① 起点：一堆 app 在抢你
plate(s0[0] - 380, s0[1] - 60, 760, 640, (g, w, h) => { const r = mulberry(3); APPS.forEach(([id, col], k) => { const x = 120 + (k % 4) * 170 + r() * 40, y = 140 + Math.floor(k / 4) * 220 + r() * 50; token(g, id, col, x, y, 70); g.fillStyle = '#E5484D'; g.beginPath(); g.arc(x + 52, y - 52, 26, 0, 7); g.fill(); g.fillStyle = '#fff'; g.font = '700 30px Inter'; g.textAlign = 'center'; g.fillText(String(3 + k * 7), x + 52, y - 41); g.textAlign = 'left'; }); hand(g, 'Every app wants you', 60, 610, 54); });
// ② 第一个回环里：晨报
{ const c = toD([506, 640]); plate(c[0], c[1], 620, 760, (g, w, h) => { g.fillStyle = 'rgba(251,227,207,.8)'; g.beginPath(); g.roundRect(10, 10, w - 20, h - 20, 40); g.fill(); ink(g); g.stroke(); hand(g, 'Morning brief', 50, 110, 78); g.strokeStyle = CLINE; g.lineWidth = 7; g.beginPath(); g.moveTo(10, 150); g.lineTo(w - 10, 150); g.stroke(); [['gmail', '#EA4335', 'Dana: yes on Friday?'], ['stripe', '#635BFF', 'Invoice #2041 overdue'], ['googledocs', '#4285F4', 'Launch doc edits']].forEach(([id, col, s], k) => { token(g, id, col, 90, 260 + k * 150, 44); hand(g, s, 150, 276 + k * 150, 50); }); }); }

{ const c = toD([612, 830]); plate(c[0], c[1], 760, 300, (g, w, h) => { ink(g); for (let i = 0; i < 7; i++) { if (i === 3) { g.fillStyle = 'rgba(66,133,244,.35)'; g.fillRect(40 + i * 96, 80, 96, 130); } g.strokeRect(40 + i * 96, 80, 96, 130); hand(g, 'MTWTFSS'[i], 72 + i * 96, 66, 44, '#6b6157'); } token(g, 'googlecalendar', '#4285F4', w - 20, 40, 34); hand(g, 'Thu 2:00 · Dana', 300, 270, 50); }); }
// ④ 第二个回环里：dashboard
{ const c = toD([735, 640]); plate(c[0], c[1], 700, 640, (g, w, h) => { const H = [.35, .55, .45, .8, .62, .95]; const C = ['#A9C99A', '#EED493', '#9CC3EC', '#4285F4', '#E9A486', '#A9C99A']; H.forEach((v, i) => { g.fillStyle = C[i] + 'B0'; g.fillRect(70 + i * 100, 520 - v * 420, 70, v * 420); ink(g, 6); g.strokeRect(70 + i * 100, 520 - v * 420, 70, v * 420); }); ink(g); g.beginPath(); g.moveTo(40, 520); g.lineTo(w - 30, 520); g.stroke(); hand(g, 'Dashboards', 210, 600, 60); }); }

{ const c = toD([735, 420]); plate(c[0], c[1], 820, 470, (g, w, h) => { g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.roundRect(10, 10, w - 20, h - 20, 44); g.fill(); g.strokeStyle = CLINE; g.lineWidth = 8; g.stroke(); token(g, 'gmail', '#EA4335', 80, 80, 40); hand(g, 'Claude Duet', 140, 96, 44, '#6b6157'); hand(g, 'Reply to Dana?', 50, 220, 96); g.fillStyle = TERRA; g.beginPath(); g.roundRect(50, 300, 280, 90, 45); g.fill(); hand(g, '✓ Approve', 90, 362, 56, '#fff'); }); }
// ⑥ 出口：原型
{ const c = toD([1060, 840]); plate(c[0], c[1], 620, 420, (g, w, h) => { ink(g); g.beginPath(); g.roundRect(20, 20, w - 40, h - 40, 28); g.stroke(); g.fillStyle = 'rgba(238,212,147,.7)'; g.fillRect(24, 24, w - 48, 60); g.beginPath(); g.moveTo(20, 86); g.lineTo(w - 20, 86); g.stroke(); g.fillStyle = 'rgba(156,195,236,.7)'; g.fillRect(60, 120, 220, 220); g.strokeRect(60, 120, 220, 220); [140, 200, 260].forEach(y => { g.beginPath(); g.moveTo(320, y); g.lineTo(w - 70, y); g.stroke(); }); token(g, 'github', '#181717', w - 70, 54, 30); }); }
// 陶土色：图标的色块，放大 9 倍，在全景时晕开
const svg = await (await fetch('assets/claude-duet-icon.svg')).text();
const BLOB = new Path2D([...svg.matchAll(/<path d="([^"]+)"/g)][1][1]);
const bloomCv = document.createElement('canvas'); bloomCv.width = bloomCv.height = 1300; const bg = bloomCv.getContext('2d');

// ---------- 镜头 ----------
const V = new THREE.Vector3();
function camera(t) {
