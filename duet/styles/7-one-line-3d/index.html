// 纸
{

  const paper = new THREE.Mesh(new THREE.PlaneGeometry(140, 100), new THREE.MeshStandardMaterial({ map: t, roughness: .95 }));
  paper.position.set(9.6, -5.4, 0); paper.receiveShadow = true; scene.add(paper);

// ---------- 路径：一串带时间的点（设计像素 + 高度 z，单位世界） ----------
const P = [];

piece(poly([[210, 600], [210, 480], [290, 545], [370, 480], [370, 600], [210, 600], [250, 640]]), 0, .38);
const bub = rrect(430, 340, 170, 110, 26), bi = near(bub, 490, 450);
piece(bez(last(), [300, 690], [470, 560], bub[bi], 30), .38, .48);
piece(rot(bub, bi).concat(poly([bub[bi], [466, 494], [462, 450]], 8)), .48, .76);
piece(bez(last(), [600, 430], [640, 470], [640, 500], 24), .76, .82);
piece(poly([[640, 500], [800, 500], [800, 640], [640, 640], [640, 500], [640, 540], [800, 540], [760, 540], [760, 480], [760, 540], [680, 540], [680, 480]]), .82, 1.0);
// 空中的一团：x、y 和平面版一样绕，z 起伏着往上长
const KN = 1500, knot = [];
for (let i = 0; i <= KN; i++) {

  knot.push([560 + R * (Math.sin(th + .3) * .9 + .35 * Math.sin(th * 2.7 + 1.1)), 520 + R * .75 * (Math.cos(th * 1.31) + .3 * Math.cos(th * 3.3 + .5)),
    ss(q / .1) * (.25 + 1.5 * (.5 + .5 * Math.sin(th * .53 + 1)) * (.55 + .45 * Math.sin(th * .19 + 2)))]);
}
piece(bez(last(), [700, 420], [620, 560], knot[0], 20), 1.0, 1.04);
const K0 = P.length - 1;
piece(knot, 1.04, FREEZE, { warp: q => Math.pow(q, .62), knot: true });
const K1 = P.length - 1, KEND = { ...P[K1] };
const CARD = { x: 1040, y: 230, w: 700, h: 470, r: 44 };
const PEN_PULL = [[KEND.x, KEND.y], [KEND.x + 160, KEND.y - 260], [CARD.x - 200, CARD.y - 60], [CARD.x + CARD.r, CARD.y]];
// 拉直的那段时间里不出新墨：线已经在那团里了
P.push({ x: CARD.x + CARD.r, y: CARD.y, z: 0, t: PULL1, acc: false, knot: false });
piece(rrect(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r), PULL1, PULL1 + .4, { warp: q => eio(q) * .85 + q * .15 });
const BTN = { x: 1090, y: 580, w: 250, h: 76 };
const btn = rrect(BTN.x, BTN.y, BTN.w, BTN.h, 38), bj = near(btn, BTN.x, BTN.y + 38);
piece(bez(last(), [CARD.x + 30, CARD.y + 160], [CARD.x + 20, BTN.y + 40], btn[bj], 40), 2.45, 2.57);
piece(rot(btn, bj), 2.57, 2.75);
piece(bez(last(), [BTN.x + 20, BTN.y + 104], [BTN.x + BTN.w + 20, BTN.y + 104], [BTN.x + BTN.w + 40, BTN.y + 38], 30), 2.75, 2.88);
const CK0 = last();
piece(poly([CK0, [CK0[0] + 26, CK0[1] + 26], [CK0[0] + 78, CK0[1] - 36]], 16), PRESS, PRESS + .2, { acc: true });
piece(bez(last(), [CK0[0] + 150, CK0[1] - 70], [1790, 760], [1880, 880], 50), PRESS + .2, 3.7);

// 笔压：速度快线细，慢线粗（在静态路径上算一次，前后平滑）
{
  const v = P.map((p, i) => { const a = P[Math.max(0, i - 1)], b = P[Math.min(NP - 1, i + 1)]; return Math.hypot(b.x - a.x, b.y - a.y) / Math.max(1e-3, b.t - a.t); });
  P.forEach((p, i) => { let s = 0, n = 0; for (let j = -4; j <= 4; j++) { const k = i + j; if (k >= 0 && k < NP) { s += .66 + .8 * Math.exp(-v[k] / 300); n++; } } p.pr = s / n; });
}

// ---------- 墨线网格：每个点一圈 8 个顶点，截面在纸上是扁的、在空中是圆的 ----------
const RS = 8, HW = .03;
const pos = new Float32Array(NP * RS * 3), nor = new Float32Array(NP * RS * 3), col = new Float32Array(NP * RS * 3);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
geo.setIndex(idx);
const inkMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .38, metalness: 0 });
const inkMesh = new THREE.Mesh(geo, inkMat); inkMesh.castShadow = true; inkMesh.receiveShadow = true; inkMesh.frustumCulled = false; scene.add(inkMesh);
const cInk = new THREE.Color(INK), cAcc = new THREE.Color(ACC);
P.forEach((p, i) => { const c = p.acc ? cAcc : cInk; for (let k = 0; k < RS; k++) col.set([c.r, c.g, c.b], (i * RS + k) * 3); });
const capMat = new THREE.MeshStandardMaterial({ color: INK, roughness: .38 });
const head = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), capMat), tail = head.clone(); head.castShadow = tail.castShadow = true; scene.add(head, tail);

function penPull(t) { const k = eio(seg(t, PULL0, PULL1)); return [lerpB(PEN_PULL, k), KEND.z * (1 - ss(k))]; }   // 拉线时笔的位置（从空中落回纸上）
function lerpB(c, t) { const v = 1 - t; return [v * v * v * c[0][0] + 3 * v * v * t * c[1][0] + 3 * v * t * t * c[2][0] + t * t * t * c[3][0], v * v * v * c[0][1] + 3 * v * v * t * c[1][1] + 3 * v * t * t * c[2][1] + t * t * t * c[3][1]]; }
const A0 = P[K0];
const tmp = [];
function pointAt(i, t) {                                         // 第 i 个点在第 t 秒的位置 [x, y, z]
  const p = P[i];
  if (!p.knot) return [p.x, p.y, p.z];
  const tt = Math.min(t, FREEZE), amp = seg(tt, 1.05, 1.5), b = eio(seg(t, PULL0, PULL1));
  let x = p.x + (vnoise(i * .37 + tt * 16) - .5) * 14 * amp * (1 - b), y = p.y + (vnoise(i * .37 + tt * 16 + 70) - .5) * 14 * amp * (1 - b), z = p.z + (vnoise(i * .29 + tt * 13 + 140) - .5) * .12 * amp * (1 - b);
  if (b > 0) { const [pp, pz] = penPull(t); x = lerp(x, lerp(A0.x, pp[0], p.u), b); y = lerp(y, lerp(A0.y, pp[1], p.u), b); z = lerp(z, pz * p.u, b); }

}
function nibAt(t) {

  let lo = 0, hi = NP - 1; if (t <= P[0].t) return pointAt(0, t); if (t >= P[hi].t) return pointAt(hi, t);
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m].t <= t) lo = m; else hi = m; }
  const a = pointAt(lo, t), b = pointAt(hi, t), k = (t - P[lo].t) / Math.max(1e-6, P[hi].t - P[lo].t); return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
}
const T = new THREE.Vector3(), UP = new THREE.Vector3(), B = new THREE.Vector3(), Z = new THREE.Vector3(0, 0, 1);
function buildInk(t) {
  let n = 0; while (n < NP && P[n].t <= t) n++;
  const W3 = [];
  for (let i = 0; i < NP; i++) { const [x, y, z] = pointAt(i, t); W3.push([X(x), Y(y), z]); }
  for (let i = 0; i < NP; i++) {
    const a = W3[Math.max(0, i - 1)], b = W3[Math.min(NP - 1, i + 1)];
    T.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]); if (T.lengthSq() < 1e-12) T.set(1, 0, 0); T.normalize();
    UP.copy(Z).addScaledVector(T, -T.dot(Z)); if (UP.lengthSq() < 1e-6) UP.set(0, 1, 0); UP.normalize();
    B.crossVectors(T, UP).normalize();
    const p = W3[i], w = HW * P[i].pr * (1 + .08 * (vnoise(i * .07) - .5)), h = w * lerp(.22, 1, clamp(p[2] / .12)), zc = p[2] + h;
    for (let k = 0; k < RS; k++) {
      const ang = k / RS * Math.PI * 2, cs = Math.cos(ang), sn = Math.sin(ang), j = (i * RS + k) * 3;
      pos[j] = p[0] + B.x * cs * w + UP.x * sn * h; pos[j + 1] = p[1] + B.y * cs * w + UP.y * sn * h; pos[j + 2] = zc + B.z * cs * w + UP.z * sn * h;
      const nx = B.x * cs * h + UP.x * sn * w, ny = B.y * cs * h + UP.y * sn * w, nz = B.z * cs * h + UP.z * sn * w, l = Math.hypot(nx, ny, nz) || 1;

const accCap = new THREE.MeshStandardMaterial({ color: ACC, roughness: .38 });

// 笔：不画出来，只在笔尖旁边留一片柔和的影子（屏幕层上，按笔尖投到屏幕的位置画）
function penShadow(t) {

// ---------- 纸上的手写字：每段字一块透明板，按时间从左往右写出来 ----------
const TXT = [];
function writing(txt, x, y, size, t0, color = INK, align = 'left') {
  const sc = 3, m = document.createElement('canvas').getContext('2d'); m.font = `${size}px Hand`;
  const w = Math.ceil(m.measureText(txt).width + 40), h = Math.ceil(size * 1.6);
  const cv = document.createElement('canvas'); cv.width = w * sc; cv.height = h * sc; const g = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w / 100, h / 100), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: .9, depthWrite: false }));
  const x0 = align === 'center' ? x - (w - 40) / 2 : x;
  mesh.position.set(X(x0 - 20 + w / 2), Y(y - size * 1.05 + h / 2), .004); mesh.receiveShadow = true; scene.add(mesh);
  const dur = .2 + .017 * txt.length;

    g.setTransform(sc, 0, 0, sc, 0, 0); g.clearRect(0, 0, w, h); g.save(); g.beginPath(); g.rect(0, 0, 20 + (w - 20) * k, h); g.clip();

writing('Claude Duet', CARD.x + 52, CARD.y + 78, 42, 2.18, '#6b6157');
writing('Reply to Dana?', CARD.x + 48, CARD.y + 178, 100, 2.22);
writing('“Yes, Friday works. Invoice attached.”', CARD.x + 52, CARD.y + 262, 44, 2.3, '#4a423a');
writing('Approve', BTN.x + BTN.w / 2, BTN.y + 54, 52, 2.5, INK, 'center');
writing('sent', CK0[0] + 92, CK0[1] + 14, 58, PRESS + .14);

// ---------- 镜头：构图中心 + 跟笔尖（滞后取平均），距离、仰角、方位角按关键帧连续变 ----------
const camK = track([
  [0, [300, 560, 6.2, 58, -100, .8]], [.9, [520, 520, 7.4, 50, -96, .6]], [1.5, [560, 500, 8.6, 27, -66, .25]],
  [PULL0, [565, 500, 8.3, 26, -64, .2]], [PULL1, [920, 440, 12.4, 48, -82, .15]], [2.6, [1300, 470, 12.8, 60, -90, 0]], [4, [1325, 470, 12.1, 62, -91, 0]]]);
function placeCam(t) {
  const [cx, cy, d, el, az, fw] = camK(t);
  let sx = 0, sy = 0, sz = 0; const n = 10;
  for (let i = 0; i < n; i++) { const [x, y, z] = nibAt(clamp(t - .5 + .9 * i / (n - 1), 0, T_END)); sx += x; sy += y; sz += z; }

}

// ---------- 字幕：屏幕上手写出来 ----------
const CAP = 'It asks before it acts.', CAP_T0 = .4;
function caption(t) {
  if (t < CAP_T0) return;
  u.save(); u.font = `${62 * S}px Hand`; u.textAlign = 'center';
  const w = u.measureText(CAP).width, k = clamp((t - CAP_T0) / (.2 + .017 * CAP.length));
  u.beginPath(); u.rect(W / 2 - w / 2 - 10 * S, 940 * S, (w + 20 * S) * k, 100 * S); u.clip();
  u.lineJoin = 'round'; u.lineWidth = 12 * S; u.strokeStyle = 'rgba(243,238,227,.9)'; u.strokeText(CAP, W / 2, 1012 * S);
  u.fillStyle = INK; u.globalAlpha = .86; u.fillText(CAP, W / 2, 1012 * S); u.restore();
}

window.DUR = 4; window.EV = [];
window.TEXTS = t => { if (t < CAP_T0 + .6) return []; u.font = `${62 * S}px Hand`; const w = u.measureText(CAP).width; return [{ id: 'cap', text: CAP, x0: (W - w) / 2, y0: 960 * S, x1: (W + w) / 2, y1: 1030 * S }]; };
window.render = t => {
  buildInk(t); placeCam(t); TXT.forEach(o => o.draw(t));
  post.composer.render();
  u.clearRect(0, 0, W, H); penShadow(t); caption(t);
};

await document.fonts.ready;
window.render(0);
window.READY = true;
</script>
