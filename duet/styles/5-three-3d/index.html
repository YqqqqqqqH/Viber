<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>duet · three 3d</title>
<style>html, body { margin: 0; background: #000; overflow: hidden } canvas { display: block; position: absolute; left: 0; top: 0 }</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>

<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<script type="module">
// 样片 ⑤ house/three-3d：象牙色的空间里，几十张通知卡像漩涡一样越转越快、越聚越多；
// 冻住 → 其余的卡被甩开、落进雾里 → Dana 那张翻面，背面就是 Duet 的批准卡，长大到镜头前 → 光标按 Approve → Sent
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { makePost } from '/core/three/post.js';
import { clamp, lerp, seg, eio, eo, ei, back, mulberry } from '/core/lib.js';

const W = innerWidth, H = innerHeight, S = W / 1920;
await new FontFace('Inter', 'url(fonts/Inter-var.woff)', { weight: '100 900' }).load().then(f => document.fonts.add(f));
const ui = document.getElementById('ui'); ui.width = W; ui.height = H; const u = ui.getContext('2d');

const ACC = '#E8743F', BGC = '#E2DBCF', INK = '#1D1D1F';
const FREEZE = 1.5, PRESS = 2.95;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(BGC); scene.fog = new THREE.Fog(BGC, 9, 26);
const camera = new THREE.PerspectiveCamera(32, W / H, .1, 60);
scene.add(new THREE.HemisphereLight('#ffffff', '#cdbfae', 1.6));
const key = new THREE.DirectionalLight('#fff3e6', 3.0); key.position.set(-4, 9, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 }); key.shadow.radius = 6; key.shadow.bias = -.0005;
scene.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: .13 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -3.4; floor.receiveShadow = true; scene.add(floor);
const post = makePost(renderer, scene, camera, W, H, { ssaa: 1 });
post.dof.maxCoc = 14; post.vig.material.uniforms.amt.value = .22;

// ---------- 贴图 ----------
function tex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d');
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.redraw = (...a) => { x.clearRect(0, 0, w, h); draw(x, ...a); t.needsUpdate = true; }; t.redraw(); return t;
}
function icon(x, kind, cx, cy, s, col) {
  x.save(); x.translate(cx, cy); x.scale(s, s); x.strokeStyle = col; x.lineWidth = 2.2; x.lineJoin = x.lineCap = 'round'; x.beginPath();
  if (kind === 'mail') { x.roundRect(-10, -7, 20, 14, 2); x.moveTo(-10, -6); x.lineTo(0, 1); x.lineTo(10, -6); }
  if (kind === 'chat') { x.roundRect(-10, -8, 20, 13, 4); x.moveTo(-4, 5); x.lineTo(-7, 10); x.lineTo(1, 5); }
  if (kind === 'cal') { x.roundRect(-9, -7, 18, 16, 2); x.moveTo(-9, -2); x.lineTo(9, -2); x.moveTo(-4, -10); x.lineTo(-4, -5); x.moveTo(4, -10); x.lineTo(4, -5); }
  if (kind === 'doc') { x.moveTo(-7, -10); x.lineTo(4, -10); x.lineTo(8, -6); x.lineTo(8, 10); x.lineTo(-7, 10); x.closePath(); x.moveTo(-3, -2); x.lineTo(4, -2); x.moveTo(-3, 3); x.lineTo(4, 3); }
  if (kind === 'box') { x.moveTo(-9, -4); x.lineTo(0, -9); x.lineTo(9, -4); x.lineTo(9, 6); x.lineTo(0, 10); x.lineTo(-9, 6); x.closePath(); x.moveTo(-9, -4); x.lineTo(0, 1); x.lineTo(9, -4); x.moveTo(0, 1); x.lineTo(0, 10); }
  x.stroke(); x.restore();
}
const LINES = [['doc', 'Invoice #2041 is overdue', 'Billing · 2m'], ['cal', 'Meeting moved to 4:00', 'Calendar · 5m'], ['box', 'Oat milk: 2 cases left', 'Inventory · now'],
  ['mail', 'Supplier price change', 'Mail · 8m'], ['chat', '14 unread in #kitchen', 'Team chat · now'], ['doc', 'Contract ready to sign', 'Signing · 12m'],
  ['mail', 'Refund request #883', 'Store · 6m'], ['cal', 'Conflict on Thursday', 'Calendar · now'], ['box', 'Delivery delayed', 'Shipping · 20m'], ['doc', 'Payroll runs tomorrow', 'Payroll · 1h']];
const CW = 2.2, CHh = .4;                                       // 通知卡尺寸（世界单位）
function noteTex(line, dana) {
  return tex(1100, 200, x => {
    x.fillStyle = '#fff'; x.beginPath(); x.roundRect(0, 0, 1100, 200, 40); x.fill();
    x.fillStyle = dana ? '#FCE6DA' : '#F1EEE9'; x.beginPath(); x.roundRect(36, 38, 124, 124, 30); x.fill();
    icon(x, line[0], 98, 100, 3.2, dana ? ACC : '#5d5a55');
    x.fillStyle = INK; x.font = '600 58px Inter'; x.fillText(line[1], 196, 96);
    x.fillStyle = '#8b877f'; x.font = '500 40px Inter'; x.fillText(line[2], 196, 152);
    if (!dana && line[1].length % 3 === 0) { x.fillStyle = '#E5484D'; x.beginPath(); x.arc(150, 46, 22, 0, 7); x.fill(); }
  });
}
const AW = 2.7, AH = 1.62;                                       // 批准卡尺寸
const appTex = tex(1350, 810, (x, t = 0) => {
  x.fillStyle = '#fff'; x.beginPath(); x.roundRect(0, 0, 1350, 810, 64); x.fill();
  x.fillStyle = ACC; x.beginPath(); x.arc(84, 88, 17, 0, 7); x.fill(); x.strokeStyle = ACC; x.lineWidth = 5; x.beginPath(); x.arc(106, 88, 17, 0, 7); x.stroke();
  x.fillStyle = INK; x.font = '620 40px Inter'; x.fillText('Claude Duet', 142, 102);
  x.fillStyle = ACC; x.font = '650 28px Inter'; x.letterSpacing = '4px'; x.textAlign = 'right'; x.fillText(t < PRESS + .1 ? 'NEEDS YOUR OK' : 'APPROVED', 1280, 100); x.letterSpacing = '0px'; x.textAlign = 'left';
  x.fillStyle = '#ece8e1'; x.fillRect(70, 150, 1210, 3);
  x.fillStyle = '#8b877f'; x.font = '500 36px Inter'; x.fillText('Dana · “Can you confirm Friday?”', 76, 222);
  x.fillStyle = INK; x.font = '680 100px Inter'; x.letterSpacing = '-2px'; x.fillText('Reply to Dana?', 70, 352); x.letterSpacing = '0px';
  x.fillStyle = '#F4F1EC'; x.beginPath(); x.roundRect(70, 396, 1210, 124, 26); x.fill();
  x.fillStyle = ACC; x.fillRect(70, 416, 7, 84);
  x.fillStyle = '#3d3b37'; x.font = '500 44px Inter'; x.fillText('“Yes — Friday works. Invoice attached.”', 108, 474);
  const press = t >= PRESS - .06 && t < PRESS + .12, done = clamp((t - PRESS - .1) / .2);
  x.save(); x.translate(70 + 190, 580 + 72); const sc = press ? .95 : 1; x.scale(sc, sc);
  x.fillStyle = press ? '#cf5f2d' : ACC; x.beginPath(); x.roundRect(-190, -72, 380 + 80 * eo(done), 144, 36); x.fill();
  x.fillStyle = '#fff'; x.font = '650 50px Inter'; x.textAlign = 'center';
  if (done < 1) { x.globalAlpha = 1 - done; x.fillText('Approve', 0, 18); x.globalAlpha = 1; }
  if (done > 0) {
    x.globalAlpha = done; x.strokeStyle = '#fff'; x.lineWidth = 11; x.lineCap = x.lineJoin = 'round';
    const ck = eo(clamp((t - PRESS - .14) / .25)); x.beginPath(); x.moveTo(-74, 2); x.lineTo(-74 + 22 * clamp(ck * 2), 2 + 22 * clamp(ck * 2)); if (ck > .5) x.lineTo(-52 + 44 * (ck - .5) * 2, 24 - 48 * (ck - .5) * 2); x.stroke();
    x.fillText('Sent', 70, 18); x.globalAlpha = 1;
  }
  x.restore(); x.textAlign = 'left';
  if (done < 1) { x.globalAlpha = 1 - done; x.strokeStyle = '#d8d3cb'; x.lineWidth = 4; x.beginPath(); x.roundRect(490, 580, 230, 144, 36); x.stroke(); x.fillStyle = INK; x.font = '600 48px Inter'; x.textAlign = 'center'; x.fillText('Edit', 605, 668); x.textAlign = 'left'; x.globalAlpha = 1; }
});

// ---------- 卡片 ----------
const whiteMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: .45, metalness: 0 });
function slab(w, h, map, back) {
  const grp = new THREE.Group();
  const box = new THREE.Mesh(new RoundedBoxGeometry(w, h, .045, 4, h * .1), whiteMat); box.castShadow = true; grp.add(box);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map, transparent: true, roughness: .5, emissive: '#ffffff', emissiveMap: map, emissiveIntensity: .32 }));
  face.position.z = back ? -.0235 : .0235; if (back) face.rotation.y = Math.PI; grp.add(face);
  return grp;
}
const rnd = mulberry(17), N = 44, cards = [];
const noteTexs = LINES.map(l => noteTex(l, false));
for (let i = 0; i < N; i++) {
  const m = slab(CW, CHh, noteTexs[i % noteTexs.length]);
  let ang = rnd() * Math.PI * 2, rad = 1.6 + rnd() * 4.2, z = -11 + rnd() * 13.5;
  if (z > -.5 && Math.hypot(Math.cos(ang) * rad + .9, Math.sin(ang) * rad * .62 - .55) < 1.6) rad += 2.2;   // 给 Dana 那张让出位置
  cards.push({ m, ang, rad, z, y0: (rnd() - .5) * 1.2, spin: (rnd() - .5) * 2.4, tilt: (rnd() - .5) * .9, t0: .03 + 1.4 * Math.pow(i / N, .6), dir: rnd() < .5 ? -1 : 1 });
  scene.add(m);
}
// Dana：正面是通知，背面贴批准卡；批准卡那块板在翻面时长大
const dana = new THREE.Group(); scene.add(dana);
const danaNote = slab(CW, CHh, noteTex(['chat', 'Dana: Can you confirm Friday?', 'Messages · now'], true)); danaNote.position.z = .03; dana.add(danaNote);
const danaApp = slab(AW, AH, appTex, true); dana.add(danaApp);
const haloTex = tex(1240, 340, x => { x.shadowColor = ACC; x.shadowBlur = 40; x.fillStyle = ACC; x.beginPath(); x.roundRect(60, 60, 1120, 220, 56); x.fill(); });
const halo = new THREE.Mesh(new THREE.PlaneGeometry((CW) * 1240 / 1100, CHh * 340 / 200), new THREE.MeshBasicMaterial({ map: haloTex, transparent: true, opacity: 0, fog: false, depthWrite: false }));
halo.position.z = .0; danaNote.add(halo); halo.position.z = -.03;
const D0 = new THREE.Vector3(-.9, .55, 3.4);                    // 比其余的卡都靠前，不会被穿过

const V = new THREE.Vector3();
function place(t) {
  const tt = Math.min(t, FREEZE);
  const swirl = tt => .25 * tt + .55 * tt * tt;                 // 漩涡越转越快
  for (const cd of cards) {
    const k = seg(t, cd.t0, cd.t0 + .35);
    const a = cd.ang + swirl(tt) * cd.dir * .6;
    let r = cd.rad * (1 + .6 * (1 - eo(k))), x = Math.cos(a) * r, y = Math.sin(a) * r * .62 + cd.y0, z = cd.z;
    let s = back(k, 1.4);
    // 冻住以后按离 Dana 的远近，被甩出去、落进雾里
    const d = Math.hypot(x - D0.x, y - D0.y, z - D0.z), off = 1.62 + .28 * clamp(d / 9);
    const q = ei(seg(t, off, off + .55));
    x += Math.cos(a) * 7 * q; y += Math.sin(a) * 3 * q - 4 * q * q; z -= 5 * q;
    cd.m.position.set(x, y, z); cd.m.scale.setScalar(Math.max(.001, s * (1 - .35 * q)));
    cd.m.rotation.set(cd.tilt + tt * cd.spin * .5 + q * 2 * cd.dir, -a * .25 + tt * cd.spin, cd.tilt * .5 + q * cd.dir);
    cd.m.visible = t >= cd.t0 && q < 1;
  }
  // Dana
  const k = seg(t, .85, 1.15), f = eio(seg(t, 1.62, 2.32)), grow = eio(seg(t, 1.75, 2.3));
  const P1 = new THREE.Vector3(0, .36, 2.05);
  dana.position.lerpVectors(D0, P1, f).add(V.set(Math.sin(Math.min(t, FREEZE) * 9) * .02 * seg(tt, .8, 1.5), Math.sin(Math.PI * f) * .35, 0));
  dana.scale.setScalar(Math.max(.001, back(k, 1.4)));
  const wob = Math.sin(tt * 5) * .12 * (1 - f);
  dana.rotation.set(.1 * (1 - f) + wob * .3, lerp(.35, Math.PI, f) + wob, -.08 * (1 - f));
  // 按下：整张卡往里一沉，再弹回
  if (t > PRESS - .05) { const p = t - PRESS; dana.position.z -= p < 0 ? 0 : .06 * Math.exp(-9 * p) * Math.cos(14 * p); dana.rotation.x += p < 0 ? 0 : .025 * Math.exp(-6 * p) * Math.sin(10 * p); }
  danaApp.scale.set(lerp(.8, 1, grow), lerp(.2, 1, grow), 1);
  danaApp.visible = t > 1.6;
  halo.material.opacity = .9 * eo(seg(t, FREEZE, FREEZE + .1)) * (1 - seg(t, 1.9, 2.1));
  dana.visible = t >= .85;
}
function cam(t) {
  const k = eio(seg(t, 0, 1.5)), k2 = eio(seg(t, 1.5, 2.6));
  const z = lerp(lerp(11.5, 8.6, k), 6.85, k2), y = lerp(.9, .45, k);
  const roll = Math.sin(Math.min(t, FREEZE) * 2.4) * .028 * seg(Math.min(t, FREEZE), .3, 1.5) * (1 - eio(seg(t, FREEZE, FREEZE + .4)));
  camera.position.set(Math.sin(Math.min(t, 1.5) * 1.3) * .25 * (1 - k2), y, z + .25 * eo(seg(t, 2.6, 4)) * -1);
  camera.lookAt(0, .32 * k2 + .1 * (1 - k2), 0); camera.rotation.z += roll;
  post.dof.focus = camera.position.distanceTo(dana.position); post.dof.aper = lerp(26, 55, k2);
}

// ---------- 2D 层：光标和字幕 ----------
function cursor(t) {
  if (t < 2.25) return;
  const p = new THREE.Vector3(-AW / 2 + (190 + 70) / 1350 * AW, AH / 2 - 652 / 810 * AH, -.03);
  // 批准卡贴在背面：卡的局部 x 在翻面后左右对调
  p.x = -p.x; danaApp.localToWorld(p); p.project(camera);
  const tx = (p.x + 1) / 2 * W, ty = (1 - p.y) / 2 * H;
  const k = eio(seg(t, 2.25, 2.85)), x0 = W * .82, y0 = H * 1.02, cx = W * .75, cy = H * .6;
  const x = (1 - k) ** 2 * x0 + 2 * k * (1 - k) * cx + k * k * tx, y = (1 - k) ** 2 * y0 + 2 * k * (1 - k) * cy + k * k * ty;
  const sq = t < PRESS ? 1 - .12 * ei(seg(t, PRESS - .1, PRESS)) : lerp(.88, 1, eo(seg(t, PRESS, PRESS + .15)));
  if (t > PRESS && t < PRESS + .5) { const q = seg(t, PRESS, PRESS + .5); u.strokeStyle = `rgba(232,116,63,${.8 * (1 - q)})`; u.lineWidth = 3 * S; u.beginPath(); u.arc(x, y, (16 + 50 * eo(q)) * S, 0, 7); u.stroke(); }
  u.save(); u.globalAlpha = seg(t, 2.25, 2.4) * (1 - seg(t, 3.5, 3.7)); u.translate(x, y); u.scale(S * sq * 1.2, S * sq * 1.2);
  u.shadowColor = 'rgba(0,0,0,.25)'; u.shadowBlur = 8; u.shadowOffsetY = 3;
  u.beginPath(); u.moveTo(0, 0); u.lineTo(0, 30); u.lineTo(8, 23); u.lineTo(14, 36); u.lineTo(19, 34); u.lineTo(13, 21); u.lineTo(24, 21); u.closePath();
  u.fillStyle = INK; u.fill(); u.shadowColor = 'transparent'; u.strokeStyle = '#fff'; u.lineWidth = 2; u.stroke(); u.restore();
}
const CAP = 'It asks before it acts.', CAP_T0 = .4;
function capBox() { u.font = `500 ${38 * S}px Inter`; const w = u.measureText(CAP).width + 70 * S; return { x: W / 2 - w / 2, y: 950 * S, w, h: 70 * S }; }
function caption(t) {
  if (t < CAP_T0) return; const k = eo(seg(t, CAP_T0, CAP_T0 + .25)), b = capBox();
  u.save(); u.globalAlpha = k; u.translate(0, (1 - k) * 14 * S);
  u.fillStyle = 'rgba(29,29,31,.86)'; u.beginPath(); u.roundRect(b.x, b.y, b.w, b.h, b.h / 2); u.fill();
  u.fillStyle = '#fff'; u.font = `500 ${38 * S}px Inter`; u.textAlign = 'center'; u.fillText(CAP, W / 2, b.y + 48 * S); u.restore();
}

window.DUR = 4; window.EV = [];
window.TEXTS = t => { if (t < CAP_T0 + .25) return []; const b = capBox(); return [{ id: 'cap', text: CAP, x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h }]; };
window.render = t => {
  place(t); cam(t);
  if (t > 1.6) appTex.redraw(t);
  post.composer.render();
  u.clearRect(0, 0, W, H); cursor(t); caption(t);
};

await document.fonts.ready;
noteTexs.forEach(x => x.redraw()); appTex.redraw(0);
window.render(0);
window.READY = true;
</script>
</body>
